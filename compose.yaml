services:
  app:
    image: tracebook:${APP_RELEASE:?set APP_RELEASE to a verified Git commit}
    build:
      context: .
      args:
        APP_RELEASE: ${APP_RELEASE}
    env_file: ${TRACEBOOK_ENV_FILE:-./.env}
    ports:
      - "127.0.0.1:${TRACEBOOK_PORT:-8083}:8000"
    volumes:
      - tracebook_data:/data
    restart: unless-stopped
    stop_grace_period: 165s
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  tracebook_data:
