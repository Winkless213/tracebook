name: Deploy

# Called by CI after the tests pass on main; run it by hand with a commit SHA to roll back or redeploy.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release:
        description: Full commit SHA whose image is already in GHCR (rollback / redeploy). Leave empty to build and deploy the branch head.
        required: false
        default: ''

permissions:
  contents: read

env:
  IMAGE: ghcr.io/winkless213/tracebook
  RELEASE: ${{ inputs.release || github.sha }}

jobs:
  image:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE }}
          build-args: APP_RELEASE=${{ env.RELEASE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    environment:
      name: production
      url: https://tracebook.sxsdas.cloud
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check the release id
        run: '[[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]] || { echo "release must be a full 40-character commit SHA"; exit 1; }'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the image exists
        run: docker manifest inspect "$IMAGE:$RELEASE" > /dev/null
      - name: Deploy on the VPS
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is bound to deploy/tracebook-deploy on the server; the read-only token lets it pull the image.
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "tracebook-deploy@$DEPLOY_HOST" "deploy $RELEASE"
      - name: Check the public endpoint
        run: |
          for _ in $(seq 20); do
            if curl -fsS --max-time 5 https://tracebook.sxsdas.cloud/health | jq -e --arg release "$RELEASE" '.release == $release' > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "https://tracebook.sxsdas.cloud/health does not report $RELEASE"
          exit 1
